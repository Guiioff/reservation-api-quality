services:
  db:
    image: postgres:16-alpine
    container_name: reservationapi_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - reservationapi_db_data:/var/lib/postgresql/data

volumes:
  reservationapi_db_data:
    driver: local
